---
- name: Converge
  hosts: all
  vars:
    nginx_tls_certificate: /etc/ssl/molecule/molecule.crt
    nginx_tls_certificate_key: /etc/ssl/molecule/molecule.key
    nginx_status_enabled: true
    nginx_status_allow:
      - 127.0.0.1
    # Host-specific rules append into the trailing `User-agent: *` stanza of
    # the default policy, without restating the agent list.
    nginx_robots_extra: |
      Disallow: /molecule-secret.php
    # AN-22: opted IN here (role default is empty) so the feature actually
    # gets exercised. forum.example.test opts back OUT below, covering the
    # per-vhost escape hatch.
    nginx_default_security_headers:
      - "Strict-Transport-Security max-age=15768000"
      - "X-Frame-Options SAMEORIGIN"
    # Proxy vhosts default to this body limit; static/php/redirect do not.
    nginx_proxy_client_max_body_size: 1m
    nginx_vhosts:
      # Proxy shape: websocket, timeout override, extra locations, and a
      # TLS upstream — the union of what the homelab edge hosts do.
      - name: app.example.test
        mode: proxy
        upstream: http://127.0.0.1:9000
        websocket: true
        proxy_read_timeout: 600
        locations:
          - path: /webhook
            upstream: http://127.0.0.1:9001/webhook
          - path: /secure/
            upstream: https://127.0.0.1:9443/
          - path: "= /old/index.php"
            return: "302 https://wiki.example.test/"
      # Opted OUT of the shared robots.txt — covers the escape hatch for a
      # vhost that serves its own (or must pass /robots.txt to a backend).
      - name: site.example.test
        mode: static
        root: /var/www/testsite
        robots: false
      # PHP app shape: front-controller routing + a denied path. php_fpm_pass is
      # a TCP address so the fixture is portable across the container php-fpm
      # versions (the socket path is version-specific; the port is not).
      # AN-22: opted OUT of the shared security headers -- covers the escape
      # hatch for a vhost that sets its own (or a backend that must not have
      # them overridden).
      - name: forum.example.test
        mode: php
        root: /var/www/phpapp
        php_fpm_pass: 127.0.0.1:9010
        php_front_controller: /app.php
        php_deny:
          - /(config|cache|store)
        security_headers: false
      - name: old.example.test
        mode: redirect
        redirect_to: https://site.example.test
        aliases:
          - older.example.test
      - name: gone.example.test
        state: absent
      # Streaming-app shape (Home Assistant): buffering off, a body limit of
      # its own, and an upstream that answers with an absolute http://
      # redirect -- the plain-HTTP backend.example.test vhost below -- so the
      # https:// Location rewrite (ProxyPassReverse parity) is exercised end
      # to end, not just rendered.
      - name: stream.example.test
        mode: proxy
        upstream: http://backend.example.test
        preserve_host: false
        buffering: false
        client_max_body_size: 50m
      - name: backend.example.test
        mode: redirect
        tls: false
        redirect_to: http://stream.example.test/landing
        redirect_code: 302
        redirect_preserve_path: false
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
