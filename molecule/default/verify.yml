---
# Note: verify cannot reference role defaults — values are hardcoded to match
# converge.yml and the role's rendered paths.
- name: Verify
  hosts: all
  tasks:
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Check nginx service state
      ansible.builtin.service_facts:

    - name: Assert nginx is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'

    - name: Stat managed and unmanaged config files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nginx/conf.d/00-websocket-map.conf
        - /etc/nginx/conf.d/01-http-redirect.conf
        - /etc/nginx/conf.d/02-status.conf
        - /etc/nginx/conf.d/app.example.test.conf
        - /etc/nginx/conf.d/site.example.test.conf
        - /etc/nginx/conf.d/old.example.test.conf
        - /etc/nginx/conf.d/gone.example.test.conf
        - /etc/nginx/sites-enabled/default
      register: nginx_verify_stats

    - name: Assert managed configs exist and removed configs are gone
      ansible.builtin.assert:
        that:
          - nginx_verify_stats.results[0].stat.exists
          - nginx_verify_stats.results[1].stat.exists
          - nginx_verify_stats.results[2].stat.exists
          - nginx_verify_stats.results[3].stat.exists
          - nginx_verify_stats.results[4].stat.exists
          - nginx_verify_stats.results[5].stat.exists
          - not nginx_verify_stats.results[6].stat.exists
          - not nginx_verify_stats.results[7].stat.exists

    - name: Read rendered proxy vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/app.example.test.conf
      register: nginx_verify_app_conf

    - name: Assert proxy vhost renders the expected directives
      ansible.builtin.assert:
        that:
          - "'proxy_pass http://127.0.0.1:9000;' in conf"
          - "'proxy_set_header Upgrade $http_upgrade;' in conf"
          - "'proxy_set_header Connection $connection_upgrade;' in conf"
          - "'proxy_read_timeout 600s;' in conf"
          - "'location /webhook {' in conf"
          - "'proxy_ssl_server_name on;' in conf"
          - "'return 302 https://wiki.example.test/;' in conf"
          - "'proxy_set_header X-Forwarded-Proto $scheme;' in conf"
      vars:
        conf: "{{ nginx_verify_app_conf.content | b64decode }}"

    - name: Request static site over HTTP (expect catch-all redirect)
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: site.example.test
        follow_redirects: none
        status_code: 301
      register: nginx_verify_http_redirect

    - name: Assert HTTP redirects to HTTPS on the same host
      ansible.builtin.assert:
        that:
          - nginx_verify_http_redirect.location == 'https://site.example.test/'

    - name: Request an ACME challenge over HTTP (must NOT redirect)
      ansible.builtin.uri:
        url: http://127.0.0.1/.well-known/acme-challenge/molecule-token
        headers:
          Host: site.example.test
        follow_redirects: none
        status_code: 200
        return_content: true
      register: nginx_verify_acme

    - name: Assert the ACME challenge is served over plain HTTP (webroot carve-out)
      ansible.builtin.assert:
        that:
          - nginx_verify_acme.content == 'molecule-acme-token-body'

    - name: Request static site over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: site.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_static

    - name: Assert static site serves the fixture
      ansible.builtin.assert:
        that:
          - "'molecule static fixture' in nginx_verify_static.content"

    - name: Request redirect vhost and its alias over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/some/path
        headers:
          Host: "{{ item }}"
        validate_certs: false
        follow_redirects: none
        status_code: 301
      loop:
        - old.example.test
        - older.example.test
      register: nginx_verify_redirect

    - name: Assert redirect vhost preserves the request path
      ansible.builtin.assert:
        that:
          - item.location == 'https://site.example.test/some/path'
      loop: "{{ nginx_verify_redirect.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Request proxy vhost (expect 502 — no backend in test)
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: app.example.test
        validate_certs: false
        status_code: 502

    - name: Read rendered php vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/forum.example.test.conf
      register: nginx_verify_php_conf

    - name: Assert php vhost renders the expected fastcgi + routing directives
      ansible.builtin.assert:
        that:
          - "'fastcgi_pass 127.0.0.1:9010;' in conf"
          - "'try_files $uri $uri/ /app.php$is_args$args;' in conf"
          - "'fastcgi_split_path_info ^(.+?\\.php)(/.*)$;' in conf"
          - "'try_files $fastcgi_script_name =404;' in conf"
          - "'location ~ /(config|cache|store) {' in conf"
          - "'deny all;' in conf"
      vars:
        conf: "{{ nginx_verify_php_conf.content | b64decode }}"

    - name: Request php app root over HTTPS (index.php must EXECUTE, not serve source)
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_php_index

    - name: Assert index.php executed (php-fpm produced output)
      ansible.builtin.assert:
        that:
          - "'PHP-OK:4' in nginx_verify_php_index.content"
          - "'<?php' not in nginx_verify_php_index.content"

    - name: Request an unmatched route (must fall through try_files to app.php)
      ansible.builtin.uri:
        url: https://127.0.0.1/topic/42-hello
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_php_route

    - name: Assert the front controller handled the unmatched route
      ansible.builtin.assert:
        that:
          - "'APP-CONTROLLER:/topic/42-hello' in nginx_verify_php_route.content"

    - name: Request a php_deny path (must be forbidden)
      ansible.builtin.uri:
        url: https://127.0.0.1/config/secret.txt
        headers:
          Host: forum.example.test
        validate_certs: false
        status_code: 403

    - name: Request stub_status endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8083/nginx_status
        return_content: true
      register: nginx_verify_status

    - name: Assert stub_status responds
      ansible.builtin.assert:
        that:
          - "'Active connections' in nginx_verify_status.content"

    # --- AN-39: HTTP/2 in the form this nginx actually understands ---
    # nginx 1.25.1 swapped `listen ... http2` for a standalone `http2`
    # directive. Emitting the wrong one is not cosmetic: the legacy parameter on
    # a modern nginx logs a deprecation warning, and the modern directive on an
    # older nginx FAILS TO PARSE and the service will not start. The matrix
    # spans both generations (debian12/ubuntu2404 are <1.25.1, debian13 and
    # ubuntu2604 are newer), so this asserts each platform got its own form.
    - name: Read the installed nginx version
      ansible.builtin.command: nginx -v
      register: nginx_verify_version
      changed_when: false

    - name: Read a rendered TLS vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/app.example.test.conf
      register: nginx_verify_vhost

    - name: Assert HTTP/2 rendered in the correct syntax for this nginx
      ansible.builtin.assert:
        that:
          - (ver is version('1.25.1', '>=')) | ternary('http2 on;' in conf, 'ssl http2;' in conf)
          # and emphatically NOT the other form
          - (ver is version('1.25.1', '>=')) | ternary('ssl http2;' not in conf, 'http2 on;' not in conf)
        fail_msg: >-
          nginx {{ ver }} got the wrong HTTP/2 syntax. Rendered vhost:
          {{ conf }}
        quiet: true
      vars:
        ver: >-
          {{ (nginx_verify_version.stderr ~ nginx_verify_version.stdout)
             | regex_search('nginx/([0-9.]+)', '\1') | first }}
        conf: "{{ nginx_verify_vhost.content | b64decode }}"
