---
# Note: verify cannot reference role defaults — values are hardcoded to match
# converge.yml and the role's rendered paths.
- name: Verify
  hosts: all
  tasks:
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Check nginx service state
      ansible.builtin.service_facts:

    - name: Assert nginx is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'

    - name: Stat managed and unmanaged config files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nginx/conf.d/00-websocket-map.conf
        - /etc/nginx/conf.d/01-http-redirect.conf
        - /etc/nginx/conf.d/02-status.conf
        - /etc/nginx/conf.d/app.example.test.conf
        - /etc/nginx/conf.d/site.example.test.conf
        - /etc/nginx/conf.d/old.example.test.conf
        - /etc/nginx/conf.d/gone.example.test.conf
        - /etc/nginx/sites-enabled/default
      register: nginx_verify_stats

    - name: Assert managed configs exist and removed configs are gone
      ansible.builtin.assert:
        that:
          - nginx_verify_stats.results[0].stat.exists
          - nginx_verify_stats.results[1].stat.exists
          - nginx_verify_stats.results[2].stat.exists
          - nginx_verify_stats.results[3].stat.exists
          - nginx_verify_stats.results[4].stat.exists
          - nginx_verify_stats.results[5].stat.exists
          - not nginx_verify_stats.results[6].stat.exists
          - not nginx_verify_stats.results[7].stat.exists

    - name: Read rendered proxy vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/app.example.test.conf
      register: nginx_verify_app_conf

    - name: Assert proxy vhost renders the expected directives
      ansible.builtin.assert:
        that:
          - "'proxy_pass http://127.0.0.1:9000;' in conf"
          - "'proxy_set_header Upgrade $http_upgrade;' in conf"
          - "'proxy_set_header Connection $connection_upgrade;' in conf"
          - "'proxy_read_timeout 600s;' in conf"
          - "'location /webhook {' in conf"
          - "'proxy_ssl_server_name on;' in conf"
          - "'return 302 https://wiki.example.test/;' in conf"
          - "'proxy_set_header X-Forwarded-Proto $scheme;' in conf"
      vars:
        conf: "{{ nginx_verify_app_conf.content | b64decode }}"

    - name: Request static site over HTTP (expect catch-all redirect)
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: site.example.test
        follow_redirects: none
        status_code: 301
      register: nginx_verify_http_redirect

    - name: Assert HTTP redirects to HTTPS on the same host
      ansible.builtin.assert:
        that:
          - nginx_verify_http_redirect.location == 'https://site.example.test/'

    - name: Request an ACME challenge over HTTP (must NOT redirect)
      ansible.builtin.uri:
        url: http://127.0.0.1/.well-known/acme-challenge/molecule-token
        headers:
          Host: site.example.test
        follow_redirects: none
        status_code: 200
        return_content: true
      register: nginx_verify_acme

    - name: Assert the ACME challenge is served over plain HTTP (webroot carve-out)
      ansible.builtin.assert:
        that:
          - nginx_verify_acme.content == 'molecule-acme-token-body'

    - name: Request static site over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: site.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_static

    - name: Assert static site serves the fixture
      ansible.builtin.assert:
        that:
          - "'molecule static fixture' in nginx_verify_static.content"

    # --- AN-22: opt-in security headers (site.example.test has no
    # security_headers: false, so it gets nginx_default_security_headers) ---
    - name: Assert security headers are present on a normal 200 response
      ansible.builtin.assert:
        that:
          - nginx_verify_static.x_frame_options == 'SAMEORIGIN'
          - "'max-age=15768000' in nginx_verify_static.strict_transport_security"
        fail_msg: "Headers seen: {{ nginx_verify_static }}"
        quiet: true

    # --- AN-23: dotfiles denied on every mode. /.well-known/ is excluded --
    # not tested here since ACME's actual carve-out is a separate catch-all
    # on :80 (already covered above); this proves the TLS vhost's own deny
    # doesn't accidentally swallow /.well-known/ too.
    - name: Request a dotfile from the static docroot (must be denied)
      ansible.builtin.uri:
        url: https://127.0.0.1/.secret-dotfile
        headers:
          Host: site.example.test
        validate_certs: false
        status_code: 404
      register: nginx_verify_dotfile_static

    - name: Assert security headers land on the dotfile 404 too (the `always` parameter)
      ansible.builtin.assert:
        that:
          - nginx_verify_dotfile_static.x_frame_options == 'SAMEORIGIN'
        quiet: true

    - name: Request /.well-known/ on the same TLS vhost (must NOT be swallowed by the dotfile deny)
      ansible.builtin.uri:
        url: https://127.0.0.1/.well-known/somewhere/token
        headers:
          Host: site.example.test
        validate_certs: false
        return_content: true
        status_code: 200
      register: nginx_verify_wellknown_tls

    - name: Assert /.well-known/ served the real fixture, not a false pass
      ansible.builtin.assert:
        that:
          - "'well-known fixture body' in nginx_verify_wellknown_tls.content"
        quiet: true

    - name: Request redirect vhost and its alias over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/some/path
        headers:
          Host: "{{ item }}"
        validate_certs: false
        follow_redirects: none
        status_code: 301
      loop:
        - old.example.test
        - older.example.test
      register: nginx_verify_redirect

    - name: Assert redirect vhost preserves the request path
      ansible.builtin.assert:
        that:
          - item.location == 'https://site.example.test/some/path'
      loop: "{{ nginx_verify_redirect.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Request proxy vhost (expect 502 — no backend in test)
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: app.example.test
        validate_certs: false
        status_code: 502

    - name: Read rendered php vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/forum.example.test.conf
      register: nginx_verify_php_conf

    - name: Assert php vhost renders the expected fastcgi + routing directives
      ansible.builtin.assert:
        that:
          - "'fastcgi_pass 127.0.0.1:9010;' in conf"
          - "'try_files $uri $uri/ /app.php$is_args$args;' in conf"
          - "'fastcgi_split_path_info ^(.+?\\.php)(/.*)$;' in conf"
          - "'try_files $fastcgi_script_name =404;' in conf"
          - "'location ~ /(config|cache|store) {' in conf"
          - "'deny all;' in conf"
      vars:
        conf: "{{ nginx_verify_php_conf.content | b64decode }}"

    - name: Request php app root over HTTPS (index.php must EXECUTE, not serve source)
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_php_index

    - name: Assert index.php executed (php-fpm produced output)
      ansible.builtin.assert:
        that:
          - "'PHP-OK:4' in nginx_verify_php_index.content"
          - "'<?php' not in nginx_verify_php_index.content"

    # --- AN-22: forum.example.test set security_headers: false -- the
    # per-vhost opt-out. Confirmed on the same response already fetched
    # above, no extra request needed.
    - name: Assert the opted-out vhost does NOT get the security headers
      ansible.builtin.assert:
        that:
          - nginx_verify_php_index.x_frame_options is not defined
          - nginx_verify_php_index.strict_transport_security is not defined
        fail_msg: "Headers seen: {{ nginx_verify_php_index }}"
        quiet: true

    # --- AN-23: dotfile deny on a mode: php vhost too -- proves "all modes",
    # and specifically that the regex location wins over the front
    # controller's try_files fallback rather than leaking .env through it.
    - name: Request a dotfile from the php docroot (must be denied, not routed to app.php)
      ansible.builtin.uri:
        url: https://127.0.0.1/.env
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
        status_code: 404
      register: nginx_verify_dotfile_php

    - name: Assert the front controller never saw it
      ansible.builtin.assert:
        that:
          - "'APP-CONTROLLER' not in nginx_verify_dotfile_php.content"
        quiet: true

    - name: Request an unmatched route (must fall through try_files to app.php)
      ansible.builtin.uri:
        url: https://127.0.0.1/topic/42-hello
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
      register: nginx_verify_php_route

    - name: Assert the front controller handled the unmatched route
      ansible.builtin.assert:
        that:
          - "'APP-CONTROLLER:/topic/42-hello' in nginx_verify_php_route.content"

    - name: Request a php_deny path (must be forbidden)
      ansible.builtin.uri:
        url: https://127.0.0.1/config/secret.txt
        headers:
          Host: forum.example.test
        validate_certs: false
        status_code: 403

    - name: Request stub_status endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8083/nginx_status
        return_content: true
      register: nginx_verify_status

    - name: Assert stub_status responds
      ansible.builtin.assert:
        that:
          - "'Active connections' in nginx_verify_status.content"

    # --- AN-71: a robots.txt on every vhost, from one host-wide policy ---
    # The load-bearing case is forum.example.test: a `mode: php` vhost with a
    # front controller. WITHOUT the snippet /robots.txt falls through to
    # app.php and returns the application with 200, which a crawler reads as
    # "nothing is disallowed" — worse than a 404. That is the exact failure
    # this feature exists to close, so it is asserted live rather than by
    # grepping config.
    - name: Read the rendered robots policy and snippet
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/nginx/robots.txt
        - /etc/nginx/snippets/robots.conf
      register: nginx_verify_robots_files

    - name: Assert the policy carries the agent list and the appended extra
      ansible.builtin.assert:
        that:
          - "'User-agent: GPTBot' in policy"
          - "'User-agent: ClaudeBot' in policy"
          - "'User-agent: Google-Extended' in policy"
          # search engines must NOT be blocked by the default policy
          - "'User-agent: Googlebot' not in policy"
          - "'User-agent: Bingbot' not in policy"
          # nginx_robots_extra appended into the trailing wildcard stanza
          - "'Disallow: /molecule-secret.php' in policy"
          # Quoted: an unquoted scalar containing ": " parses as a YAML mapping,
          # not a string, and ansible-core rejects it as a conditional.
          - "policy.rstrip().endswith('Disallow: /molecule-secret.php')"
          - "'alias /etc/nginx/robots.txt;' in snippet"
        fail_msg: "Rendered /etc/nginx/robots.txt:\n{{ policy }}"
        quiet: true
      vars:
        policy: "{{ nginx_verify_robots_files.results[0].content | b64decode }}"
        snippet: "{{ nginx_verify_robots_files.results[1].content | b64decode }}"

    - name: Read vhosts that should and should not include the snippet
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/nginx/conf.d/forum.example.test.conf
        - /etc/nginx/conf.d/site.example.test.conf
      register: nginx_verify_robots_vhosts

    - name: Assert the include is present by default and absent when opted out
      ansible.builtin.assert:
        that:
          - "'include snippets/robots.conf;' in included"
          - "'include snippets/robots.conf;' not in excluded"
        quiet: true
      vars:
        included: "{{ nginx_verify_robots_vhosts.results[0].content | b64decode }}"
        excluded: "{{ nginx_verify_robots_vhosts.results[1].content | b64decode }}"

    - name: Request /robots.txt from the PHP front-controller vhost
      ansible.builtin.uri:
        url: https://127.0.0.1/robots.txt
        headers:
          Host: forum.example.test
        validate_certs: false
        return_content: true
        status_code: 200
      register: nginx_verify_robots_served

    - name: Assert the policy is served as text/plain, not the PHP app
      ansible.builtin.assert:
        that:
          - "'User-agent: GPTBot' in nginx_verify_robots_served.content"
          - "'Disallow: /molecule-secret.php' in nginx_verify_robots_served.content"
          # mime.types maps .txt; a front-controller hit would be text/html
          - "'text/plain' in nginx_verify_robots_served.content_type"
        fail_msg: >-
          /robots.txt on the php vhost returned
          {{ nginx_verify_robots_served.content_type }}:
          {{ nginx_verify_robots_served.content[:200] }}
        quiet: true

    - name: Request /robots.txt from the opted-out vhost (expect 404)
      ansible.builtin.uri:
        url: https://127.0.0.1/robots.txt
        headers:
          Host: site.example.test
        validate_certs: false
        status_code: 404

    # --- AN-39: HTTP/2 in the form this nginx actually understands ---
    # nginx 1.25.1 swapped `listen ... http2` for a standalone `http2`
    # directive. Emitting the wrong one is not cosmetic: the legacy parameter on
    # a modern nginx logs a deprecation warning, and the modern directive on an
    # older nginx FAILS TO PARSE and the service will not start. The matrix
    # spans both generations (debian12/ubuntu2404 are <1.25.1, debian13 and
    # ubuntu2604 are newer), so this asserts each platform got its own form.
    - name: Read the installed nginx version
      ansible.builtin.command: nginx -v
      register: nginx_verify_version
      changed_when: false

    - name: Read a rendered TLS vhost
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/app.example.test.conf
      register: nginx_verify_vhost

    - name: Assert HTTP/2 rendered in the correct syntax for this nginx
      ansible.builtin.assert:
        that:
          - (ver is version('1.25.1', '>=')) | ternary('http2 on;' in conf, 'ssl http2;' in conf)
          # and emphatically NOT the other form
          - (ver is version('1.25.1', '>=')) | ternary('ssl http2;' not in conf, 'http2 on;' not in conf)
        fail_msg: >-
          nginx {{ ver }} got the wrong HTTP/2 syntax. Rendered vhost:
          {{ conf }}
        quiet: true
      vars:
        ver: >-
          {{ (nginx_verify_version.stderr ~ nginx_verify_version.stdout)
             | regex_search('nginx/([0-9.]+)', '\1') | first }}
        conf: "{{ nginx_verify_vhost.content | b64decode }}"
