---
# Test fixtures. TLS material is generated at runtime rather than committed —
# checked-in PEM blocks trip the gitleaks CI job (lesson from the certs role).
- name: Prepare
  hosts: all
  tasks:
    - name: Install openssl for throwaway cert generation
      ansible.builtin.apt:
        name: openssl
        state: present
        update_cache: true

    - name: Create TLS fixture directory
      ansible.builtin.file:
        path: /etc/ssl/molecule
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate throwaway self-signed certificate
      ansible.builtin.command: >-
        openssl req -x509 -newkey rsa:2048 -nodes
        -keyout /etc/ssl/molecule/molecule.key
        -out /etc/ssl/molecule/molecule.crt
        -days 7 -subj "/CN=*.example.test"
      args:
        creates: /etc/ssl/molecule/molecule.crt

    - name: Create nginx conf.d ahead of install (for stale-config fixture)
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Plant stale vhost config (role must remove it via state absent)
      ansible.builtin.copy:
        content: "# stale config that the role should remove\n"
        dest: /etc/nginx/conf.d/gone.example.test.conf
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Create static site docroot fixture
      ansible.builtin.file:
        path: /var/www/testsite
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create static site index fixture
      ansible.builtin.copy:
        content: "molecule static fixture\n"
        dest: /var/www/testsite/index.html
        owner: root
        group: root
        mode: "0644"
        force: false

    # ---- PHP-FPM fixture for the `mode: php` vhost ----
    - name: Install php-fpm (distro default version) for the php-mode fixture
      ansible.builtin.apt:
        name: php-fpm
        state: present
        update_cache: true

    - name: Locate the php-fpm pool config(s)
      ansible.builtin.find:
        paths: /etc/php
        patterns: www.conf
        recurse: true
      register: molecule_fpm_pools

    - name: Point the php-fpm pool at TCP 127.0.0.1:9010 (version-independent)
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^listen = .*$'
        replace: "listen = 127.0.0.1:9010"
      loop: "{{ molecule_fpm_pools.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Enable and (re)start php-fpm on the new listener
      ansible.builtin.shell: |
        set -e
        svc=$(systemctl list-unit-files --type=service 'php*-fpm.service' --no-legend | awk '{print $1}' | head -1)
        systemctl enable "$svc"
        systemctl restart "$svc"
        echo "$svc"
      register: molecule_fpm_svc
      changed_when: true

    - name: Create php app docroot fixture
      ansible.builtin.file:
        path: /var/www/phpapp
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Plant an executable index.php (proves php-fpm runs, not raw source)
      ansible.builtin.copy:
        content: "<?php echo 'PHP-OK:' . (2 + 2);\n"
        dest: /var/www/phpapp/index.php
        owner: www-data
        group: www-data
        mode: "0644"
        force: false

    - name: Plant a front-controller app.php (proves try_files routing fallback)
      ansible.builtin.copy:
        content: "<?php echo 'APP-CONTROLLER:' . $_SERVER['REQUEST_URI'];\n"
        dest: /var/www/phpapp/app.php
        owner: www-data
        group: www-data
        mode: "0644"
        force: false

    - name: Create a denied subdir + secret (proves php_deny blocks it)
      ansible.builtin.file:
        path: /var/www/phpapp/config
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Plant a secret in the denied dir
      ansible.builtin.copy:
        content: "SECRET-SHOULD-NOT-BE-SERVED\n"
        dest: /var/www/phpapp/config/secret.txt
        owner: www-data
        group: www-data
        mode: "0644"
        force: false

    - name: Create ACME webroot challenge dir fixture
      ansible.builtin.file:
        path: /var/www/html/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Plant an ACME challenge token fixture
      ansible.builtin.copy:
        content: "molecule-acme-token-body"
        dest: /var/www/html/.well-known/acme-challenge/molecule-token
        owner: root
        group: root
        mode: "0644"
        force: false
