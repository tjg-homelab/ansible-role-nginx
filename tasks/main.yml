---
- name: Assert vhost entries are well formed
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.mode | default('proxy') in ['proxy', 'static', 'redirect', 'php']
      - item.mode | default('proxy') != 'proxy'
        or item.upstream is defined
        or item.locations is defined
      - item.mode | default('proxy') != 'static' or item.root is defined
      - item.mode | default('proxy') != 'php' or item.root is defined
      - item.mode | default('proxy') != 'redirect' or item.redirect_to is defined
      - not (item.tls | default(true))
        or item.tls_certificate is defined
        or nginx_tls_certificate | length > 0
    fail_msg: >-
      nginx_vhosts entry '{{ item.name | default('<unnamed>') }}' is invalid:
      needs a name, a valid mode (proxy/static/redirect/php), the mode's required
      key (proxy->upstream, static/php->root, redirect->redirect_to), and TLS
      material (per-vhost or nginx_tls_certificate).
  loop: "{{ nginx_vhosts }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"
  when: item.state | default('present') == 'present'

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

# nginx 1.25.1 replaced `listen ... http2` with a standalone `http2` directive
# and deprecated the old form. Emitting the wrong one is not cosmetic: the
# legacy parameter on a modern nginx logs a deprecation warning, and the modern
# directive on an older nginx fails to parse and the service will not start.
# Detect rather than assume — this fleet currently spans 1.22 and 1.24, while
# the CI matrix covers 1.26+.
- name: Read the installed nginx version
  ansible.builtin.command: nginx -v
  register: nginx_version_probe
  changed_when: false
  check_mode: false

- name: Record the nginx version
  # nginx -v writes to stderr on most builds and stdout on some; concatenating
  # both avoids depending on which.
  ansible.builtin.set_fact:
    nginx_installed_version: >-
      {{ (nginx_version_probe.stderr ~ nginx_version_probe.stdout)
         | regex_search('nginx/([0-9.]+)', '\1') | first }}

- name: Remove distro default site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  when: nginx_remove_default_site | bool
  notify: Reload nginx

- name: Install websocket connection-upgrade map
  ansible.builtin.template:
    src: websocket-map.conf.j2
    dest: /etc/nginx/conf.d/00-websocket-map.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Manage catch-all HTTP to HTTPS redirect
  ansible.builtin.template:
    src: http-redirect.conf.j2
    dest: /etc/nginx/conf.d/01-http-redirect.conf
    owner: root
    group: root
    mode: "0644"
  when: nginx_http_redirect | bool
  notify: Reload nginx

- name: Remove catch-all HTTP redirect when disabled
  ansible.builtin.file:
    path: /etc/nginx/conf.d/01-http-redirect.conf
    state: absent
  when: not nginx_http_redirect | bool
  notify: Reload nginx

- name: Manage stub_status endpoint
  ansible.builtin.template:
    src: status.conf.j2
    dest: /etc/nginx/conf.d/02-status.conf
    owner: root
    group: root
    mode: "0644"
  when: nginx_status_enabled | bool
  notify: Reload nginx

- name: Remove stub_status endpoint when disabled
  ansible.builtin.file:
    path: /etc/nginx/conf.d/02-status.conf
    state: absent
  when: not nginx_status_enabled | bool
  notify: Reload nginx

# Must run BEFORE the vhosts: a vhost including a snippet that does not exist
# yet fails `nginx -t`, and the reload handler would take the whole service
# down with it.
- name: Manage the robots.txt policy
  ansible.builtin.template:
    src: robots.txt.j2
    dest: /etc/nginx/robots.txt
    owner: root
    group: root
    mode: "0644"
  when: nginx_robots_enabled | bool
  notify: Reload nginx

- name: Ensure the snippets directory exists
  ansible.builtin.file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nginx_robots_enabled | bool

- name: Manage the robots.txt location snippet
  ansible.builtin.template:
    src: robots-snippet.conf.j2
    dest: /etc/nginx/snippets/robots.conf
    owner: root
    group: root
    mode: "0644"
  when: nginx_robots_enabled | bool
  notify: Reload nginx

# Order matters on the way out too: the vhosts are re-rendered without the
# include in the same play, so the config is never momentarily inconsistent.
- name: Remove the robots.txt policy when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/snippets/robots.conf
    - /etc/nginx/robots.txt
  when: not nginx_robots_enabled | bool
  notify: Reload nginx

- name: Render vhost configurations
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_vhosts | selectattr('state', 'undefined') | list
            + nginx_vhosts | selectattr('state', 'defined')
                           | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Remove vhosts with state absent
  ansible.builtin.file:
    path: "/etc/nginx/conf.d/{{ item.name }}.conf"
    state: absent
  loop: "{{ nginx_vhosts | selectattr('state', 'defined')
                         | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
