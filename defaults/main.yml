---
# Virtual hosts to manage. Each entry renders one file in
# /etc/nginx/conf.d/<name>.conf. See README for the full entry schema.
nginx_vhosts: []

# Role-level default TLS material, used by any vhost that does not set its
# own tls_certificate / tls_certificate_key. Point these at the cert your
# cert-distribution tooling drops on the host (e.g. a wildcard cert).
# Required (per vhost or here) unless a vhost sets `tls: false`.
nginx_tls_certificate: ""
nginx_tls_certificate_key: ""

# TLS policy applied to every TLS vhost. Empty ciphers string means
# "use the nginx/openssl defaults", which are sane on modern distros.
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"

# HTTP/2 on TLS vhosts. Worth having on its own merits (multiplexing, header
# compression, no head-of-line blocking across six sockets), and it is also what
# makes a per-IP connection limit sane: under HTTP/1.1 one browser opens ~6
# parallel connections per origin, so a limit of 5 throttles a NORMAL page load.
#
# The role picks the right syntax for the installed nginx automatically — see
# the version detection in tasks/main.yml. Set false to opt a whole host out.
nginx_http2: true
nginx_ssl_ciphers: ""

# Install a catch-all port-80 server that 301-redirects every request to
# https://<same host><same uri>. Replaces per-vhost HTTP redirect blocks;
# disable if something else owns port 80.
nginx_http_redirect: true

# Install a catch-all :443 server that refuses the TLS handshake for any SNI
# name no vhost claims (ssl_reject_handshake). Without it, an unknown name or
# the bare IP is answered by whichever vhost loads first. Needs nginx 1.19.4+.
nginx_https_reject_unknown: true

# TLS session resumption on every TLS vhost (fewer full handshakes per
# visitor). Mozilla's intermediate profile values. Empty cache = leave unset.
nginx_ssl_session_cache: "shared:SSL:10m"
nginx_ssl_session_timeout: "1d"

# Carve HTTP-01 ACME challenges out of that catch-all: the port-80 server
# serves /.well-known/acme-challenge/ from a webroot over plain HTTP instead of
# 301-ing it to HTTPS. Required for `certbot --webroot` renewals (an ACME
# validator only speaks HTTP on :80). Set false to redirect everything (no
# on-host certbot). Only takes effect when nginx_http_redirect is true.
nginx_acme_challenge: true
nginx_acme_webroot: /var/www/html

# Remove the distro's default site (/etc/nginx/sites-enabled/default) so it
# cannot shadow managed vhosts.
nginx_remove_default_site: true

# ---------- robots.txt ----------
# Serve a robots.txt on EVERY vhost this role generates, from one host-wide
# policy file. Without this a site has no robots.txt at all, and an app with a
# front controller (mode: php) is worse than silent: the request falls through
# to the app and returns an HTML page with 200, which a crawler reads as "no
# restrictions". Set false to opt a whole host out; set `robots: false` on a
# single vhost entry to opt just that one out (e.g. a proxied app that serves
# its own).
nginx_robots_enabled: true

# The policy body. ONE file is shared by every vhost on the host, so keep it to
# rules that are safe everywhere; per-site rules belong in nginx_robots_extra
# or behind a per-vhost opt-out.
#
# DEFAULT POLICY: block AI/LLM training and scraping agents, leave search
# engines alone. Googlebot and Bingbot are deliberately absent — blocking those
# deindexes the site, which is almost never what you want from a role default.
# Google-Extended is Google's AI-training opt-out token and does NOT affect
# Search indexing or ranking; that separation is the entire reason it exists as
# a distinct token, and it is why blocking it here is safe.
#
# The `User-agent: *` stanza goes LAST so nginx_robots_extra appends into it.
nginx_robots_content: |
  User-agent: GPTBot
  Disallow: /

  User-agent: OAI-SearchBot
  Disallow: /

  User-agent: ChatGPT-User
  Disallow: /

  User-agent: ClaudeBot
  Disallow: /

  User-agent: anthropic-ai
  Disallow: /

  User-agent: CCBot
  Disallow: /

  User-agent: Google-Extended
  Disallow: /

  User-agent: PerplexityBot
  Disallow: /

  User-agent: Bytespider
  Disallow: /

  User-agent: meta-externalagent
  Disallow: /

  User-agent: Amazonbot
  Disallow: /

  User-agent: *
  Crawl-delay: 10

# Appended verbatim to the end of the policy, i.e. INSIDE the trailing
# `User-agent: *` stanza. This is the hook for host-specific Disallow rules
# (expensive endpoints, session-bearing URLs) without restating the agent list
# above. Example, for a phpBB host:
#   nginx_robots_extra: |
#     Disallow: /ucp.php
#     Disallow: /search.php
nginx_robots_extra: ""

# FastCGI upstream for `mode: php` vhosts (php-fpm). Default is the Debian/Ubuntu
# php-fpm unix socket for PHP 8.4; override per host (e.g. a different PHP version)
# or per vhost via `php_fpm_pass`. Installing php-fpm itself is out of the role's
# scope — provision it separately so the socket exists before nginx reloads.
nginx_php_fpm_pass: "unix:/run/php/php8.4-fpm.sock"

# Optional stub_status endpoint (the nginx equivalent of Apache's
# mod_status server-status page), served on its own port.
nginx_status_enabled: false
nginx_status_port: 8083
nginx_status_allow:
  - 127.0.0.1

# Headers set on every proxied request, in addition to Host (see the
# per-vhost preserve_host flag).
nginx_proxy_set_headers:
  X-Real-IP: "$remote_addr"
  X-Forwarded-For: "$proxy_add_x_forwarded_for"
  X-Forwarded-Proto: "$scheme"
  X-Forwarded-Port: "$server_port"
  X-Forwarded-Host: "$host"

# Rewrite a backend's absolute http:// redirects to https:// on TLS vhosts
# (alongside nginx's `proxy_redirect default`). The ProxyPassReverse
# equivalent for a backend that sees the real Host but not the TLS in front of
# it. Per vhost/location: `proxy_redirect_https: false`.
nginx_proxy_redirect_https: true

# client_max_body_size for `mode: proxy` vhosts that do not set their own
# `client_max_body_size`. Empty = inherit the http-level value (nginx's 1m, or
# whatever a hardening layer sets -- devsec's nginx_hardening sets 1k, which
# rejects ordinary JSON API writes with 413). Static/redirect/php vhosts are
# never affected by this default.
nginx_proxy_client_max_body_size: ""

# ---------- Security headers (AN-22) ----------
# OFF by default (empty). Each entry is a full "Header value" string, added
# with `always` so it also lands on error responses (404, 403, 502, ...),
# not just the 2xx/3xx nginx applies add_header to without it.
#
# WHY OFF, NOT A SENSIBLE-DEFAULT SET: `add_header` inside a server block
# DISCARDS every header inherited from a parent context (http-level). A
# consumer that already pairs this role with a dedicated hardening layer
# (e.g. devsec.hardening.nginx_hardening, which applies its own set at the
# http level) would have those silently REPLACED, not added to, the moment
# this role also emits add_header per vhost -- turning a two-layer setup into
# a one-layer one with no visible error. Defaulting to empty means adopting a
# new role version changes nothing for an existing pairing; a consumer using
# this role STANDALONE (no separate hardening layer) opts in explicitly and
# gets a real baseline instead of silently shipping with none. Set false on
# a specific vhost (security_headers: false) to exclude it.
nginx_default_security_headers: []
